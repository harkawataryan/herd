name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test -race ./...
      - name: Benchmark smoke
        run: BENCH_DURATION=10s bench/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results.md

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t herd:ci .
