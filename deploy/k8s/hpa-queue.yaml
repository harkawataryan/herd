# Queue-depth autoscaling for the gateway. Requires prometheus-adapter
# exposing herd_queue_depth as a custom metric (rule in README). Scales up
# when more than 5 requests are waiting for admission per gateway pod.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-queue
  namespace: herd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Pods
      pods:
        metric:
          name: herd_queue_depth
        target:
          type: AverageValue
          averageValue: "5"
