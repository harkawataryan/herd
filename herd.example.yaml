# Herd gateway configuration. Copy to herd.yaml and edit.
listen: ":8080"

# round_robin | least_queue | kv_aware | prefix_aware | llmd_style | dynamo_style | pack
policy: pack

# How often to scrape each replica's /metrics for KV-cache and queue gauges.
scrape_interval_ms: 500
# Load score (0..1) at or above which a replica counts as saturated.
saturation_threshold: 0.9
# Serve the routing UI from this directory (optional).
ui_dir: ui
default_max_tokens: 128

# pack policy. prefill_tps is your servers' prompt-processing rate, used to
# express an expected wait in prefill blocks (4000 is a small model on one
# modern GPU). pack_slack_blocks is how much extra cost the policy accepts
# to keep a conversation or prompt family on the replica that holds it.
# value_half_life_ms is how fast a prompt's popularity fades; session_gap_ms
# is the assumed time between an agent's turns until it shows its own.
prefill_tps: 4000
pack_slack_blocks: 8
evict_weight: 1
value_half_life_ms: 60000
session_gap_ms: 5000

# Your own model servers: vLLM, llama.cpp server, Ollama, or the simulator.
backends:
  - name: sim-1
    url: http://127.0.0.1:9001
    models: [llama-3-8b]
    kv_capacity: 32768
    max_batch: 16
  - name: sim-2
    url: http://127.0.0.1:9002
    models: [llama-3-8b]
    kv_capacity: 32768
    max_batch: 16
  - name: sim-3
    url: http://127.0.0.1:9003
    models: [llama-3-8b]
    kv_capacity: 32768
    max_batch: 16

# Hosted providers used only when local capacity is saturated (or for
# models no local replica serves). Prices are USD per million tokens.
providers:
  - name: openai
    url: https://api.openai.com
    models: [gpt-4o-mini]
    model_map: {llama-3-8b: gpt-4o-mini}
    price_in_per_m: 0.15
    price_out_per_m: 0.60
    api_key_env: OPENAI_API_KEY

# API keys map to tenants; budget caps cloud spend per tenant.
tenants:
  - name: demo
    api_key: demo-key
    weight: 1
    budget_usd: 5.0
